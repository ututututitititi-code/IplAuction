.bid{font-size:22px;margin-top:8px}.bid b{color:var(--gold);font-size:30px}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px}
.team{border-top:6px solid var(--c);padding:12px}
.team.lead{box-shadow:0 0 0 2px var(--c),0 0 24px var(--c)}
.team h3{margin:0;display:flex;justify-content:space-between;align-items:center;font-size:16px}
.purse{color:var(--gold);font-weight:800}
.team .btn{width:100%;margin:8px 0;background:var(--c);color:#fff;text-shadow:0 1px 2px #000a}
.team.t-yellow .btn{color:#111;text-shadow:none}
.slots{font-size:12.5px;display:grid;gap:2px}
.slot{display:flex;gap:6px;padding:3px 6px;border-radius:6px;background:#ffffff0a;color:var(--mu)}
.slot.f{color:var(--tx);background:#ffffff18}.slot span:first-child{width:22px;font-weight:700}
.slot.hit{outline:1px dashed #ff6b6b}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000a;z-index:9;font-size:clamp(34px,8vw,80px);font-weight:900;text-align:center}

.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:14px;text-align:left}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;flex-wrap:wrap}
.chip{font-size:13px;color:var(--mu)}

 $('app').innerHTML=`<div class="top"><h1 style="font-size:26px">🏏 IPL MEGA AUCTION</h1><span class="chip">${c?'🧢 Coaches':'Players'} · #${G.seen} of ${G.total} · Sold ${G.sold}${G.round2?' · 🔁 Unsold round':''}</span></div>
 <div class="stage"><div class="card pl"><div class="chip">NOW ON THE BLOCK</div><div class="nm">${p.n}</div>
 <div class="tags"><span class="tag">${FL[p.c]}</span><span class="tag">${c?'🧢 Coach':RL[p.r]}</span>${p.wk?'<span class="tag">🧤 Wicketkeeper</span>':''}${p.u?'<span class="tag" style="background:#2e7d32">🌱 Uncapped</span>':''}<span class="tag">Base $${p.b}</span>${p.b>=7?'<span class="tag" style="background:var(--gold);color:#111">⭐ Marquee</span>':''}</div>
 <div>${c?'Currently with <span class="pos">'+p.note+'</span>':'Bats at <span class="pos">#'+p.p+'</span>'}</div>
 <div class="timer" id="tm">${Math.ceil((G.dl-Date.now())/1000)}</div><div class="bar"><i id="bf" style="width:100%"></i></div>
 <div class="bid">${G.bidder?`Current bid <b>$${G.bid}</b> by <span style="color:${bc};font-weight:800">${G.bidder.name}</span>`:'No bids yet · starts at <b>$'+p.b+'</b>'}</div>
 <div style="margin-top:12px;display:flex;gap:10px;justify-content:center"><button class="btn" style="background:#43a047;color:#fff" ${G.bidder?'':'disabled'} onclick="forceSell()">🔨 SOLD</button><button class="btn" style="background:#e53935;color:#fff" ${G.bidder?'disabled':''} onclick="forceSell()">⏭ UNSOLD</button></div></div></div>
 <div class="teams">${G.teams.map((t,i)=>`<div class="card team t-${t.cls} ${G.bidder===t?'lead':''}" style="--c:${t.col}"><h3>${t.name}<span class="purse">$${t.purse}</span></h3>
 <div class="chip">🇮🇳 ${t.ind} · 🌍 ${t.fo}/4 · ${t.n}/15 · XI ${11-empt(t)}/11 · 🧤 ${t.wk}</div>
 <button class="btn" ${canBid(t)?'':'disabled'} onclick="bid(${i})">${canBid(t)?'BID $'+nb():why(t,p)}</button>
 <div class="slots">${slots(t,p)}</div></div>`).join('')}</div>
 <div class="center" style="margin:24px"><button class="btn" id="eb" style="background:#444;color:#fff" onclick="endAsk()">⛔ End the bidding</button></div>`}
function endAsk(){const b=$('eb');if(eAsk){end();return}eAsk=1;b.textContent='⚠ Tap again to confirm';b.style.background='#c62828';setTimeout(()=>{eAsk=0;const x=$('eb');if(x){x.textContent='⛔ End the bidding';x.style.background='#444'}},4000)}
function end(){
 G.phase='over';$('ov').className='ov';eAsk=0;const val=t=>Object.values(t.r).flat().reduce((a,x)=>a+x.b,0)+(t.coach?t.coach.b:0);
 let L=G.teams.slice().sort((a,b)=>val(b)-val(a));
 $('app').innerHTML=`<div class="center"><h1>🏆 AUCTION COMPLETE</h1><p>Best squad (by value): <b style="color:var(--gold)">${L[0].name}</b></p></div>
 <div class="res">${L.map(t=>`<div class="card team" style="--c:${t.col}"><h3>${t.name}<span class="purse">Left $${t.purse}</span></h3><div class="chip">Value ${val(t)} · ${t.n} players · XI ${11-empt(t)}/11 · 🇮🇳 ${t.ind} 🌍 ${t.fo}</div><br><div class="slots">${slots(t)}</div></div>`).join('')}</div>
 <div class="center"><br><button class="btn" onclick="G=null;setup()">Play Again</button></div>`}
setup();
</script></body></html>
